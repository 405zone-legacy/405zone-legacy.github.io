<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Betrayed</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="stylesheet" href="../css/samside-base.css">
  <script src="../js/samside-base.js"></script>
  <style>
    .hb-hint {
      position: absolute; bottom: 6vh; left: 50%; transform: translateX(-50%);
      z-index: 2; font-size: .85rem; letter-spacing: 2px; opacity: .8;
      animation: samside-fade-in 1.5s ease;
      transition: opacity .5s ease;
    }
    .hb-hint.hidden { opacity: 0; }
    .hb-hint { cursor: pointer; pointer-events: auto; }
    .hb-hint-mobile { display: none; }
    @media (hover: none) and (pointer: coarse) {
      .hb-hint-desktop { display: none; }
      .hb-hint-mobile { display: inline; }
    }
  </style>
</head>
<body>
  <div class="samside-stage">
    <img class="samside-bg no-drag" src="../media/mythical_tape.png" alt="" draggable="false">
    <p class="hb-hint" id="hbHint">
      <span class="hb-hint-desktop">[ SPACE ]</span>
      <span class="hb-hint-mobile">[ TAP ]</span>
    </p>
  </div>
  <script>

    var hint = document.getElementById('hbHint');
    var used = false;

    function triggerHb() {
      if (used) return;
      used = true;
      SAMSIDE.playSafe('../sfx/hellbai.mp3', { volume: 0.75, loop: true });
      hint.classList.add('hidden');
    }

    document.addEventListener('keydown', function (e) {
      if (e.code !== 'Space' || used) return;
      e.preventDefault();
      triggerHb();
    });

    /* Movil: no hay teclado, asi que tambien se puede tocar la pantalla */
    document.addEventListener('touchend', function (e) {
      e.preventDefault();
      triggerHb();
    }, { passive: false });
    hint.addEventListener('click', triggerHb);
  </script>
</body>
</html>
