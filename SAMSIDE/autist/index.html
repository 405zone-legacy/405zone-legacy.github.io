<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ASSTIN! (EPILEPSY WARNING!!)</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="stylesheet" href="../css/samside-base.css">
  <script src="../js/samside-base.js"></script>
  <style>
    html, body, .samside-stage { touch-action: none; user-select: none; }
    body.mouse, body.mouse * { cursor: none; }
    .au-sprite { position: absolute; z-index: 2; top: 0; left: 0; width: clamp(130px, 26vmin, 320px); height: auto; filter: url(#auWave); will-change: transform; }
    #cv { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    .au-hud { position: absolute; z-index: 3; top: 0; left: 0; right: 0; padding: 1.2vh 3vw; display: flex; justify-content: space-between; align-items: center; gap: 2vw; font-size: clamp(.8rem, 2.6vw, 1.3rem); text-shadow: 0 0 6px #000; }
    .au-bar { width: clamp(90px, 30vw, 240px); height: 1.1em; background: #600; border: 2px solid #fff; }
    .au-bar i { display: block; height: 100%; width: 100%; background: #ff0; }
    #auMsg { position: absolute; z-index: 20; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.85); color: #f22; font-size: clamp(1.5rem, 6vw, 3rem); text-align: center; }
    .au-popup { position: absolute; z-index: 10; pointer-events: none; object-fit: fill; box-shadow: 0 0 0 2px #fff, 0 10px 26px rgba(0,0,0,.65); image-rendering: pixelated; transition: opacity .3s; }
  </style>
</head>
<body>
  <div class="samside-stage" id="stg">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="auWave" x="-25%" y="-25%" width="150%" height="150%">
        <feTurbulence id="auNoise" type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="1" seed="4" result="n"/>
        <feDisplacementMap id="auDisp" in="SourceGraphic" in2="n" scale="24" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </svg>
    <img class="au-sprite no-drag" id="auSprite" src="../media/asstin.png" alt="" draggable="false">
    <canvas id="cv"></canvas>
    <div class="au-hud"><div>HP <span id="hpN">100</span>/100<div class="au-bar"><i id="hpB"></i></div></div><div id="tm">00:00.0</div><div id="bs">BEST 00:00.0</div></div>
    <div id="auMsg">YOU DIED<br>...AGAIN.</div>
  </div>
  <script>
    SAMSIDE.bgm(SAMSIDE.url('sfx/ASSTIN.mp3'), { loop: true, volume: .075 });

    function sfx(name, vol) { try { var a = new Audio(SAMSIDE.url('sfx/' + name)); a.volume = vol || .1; a.play().catch(function () {}); } catch (e) {} }
    var actx;
    function beepError() {
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)(); var t = actx.currentTime;
        [880, 440].forEach(function (f, i) {
          var o = actx.createOscillator(), g = actx.createGain(); o.type = 'square'; o.frequency.value = f;
          g.gain.setValueAtTime(.0001, t + i * .12); g.gain.exponentialRampToValueAtTime(.22, t + i * .12 + .01); g.gain.exponentialRampToValueAtTime(.0001, t + i * .12 + .1);
          o.connect(g); g.connect(actx.destination); o.start(t + i * .12); o.stop(t + i * .12 + .12);
        });
      } catch (e) {}
    }
    function beepNote(f) {
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)(); var t = actx.currentTime;
        var o = actx.createOscillator(), g = actx.createGain(); o.type = 'triangle'; o.frequency.value = f + SAMSIDE.rand(-20, 20);
        g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.2, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .22);
        o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + .24);
      } catch (e) {}
    }

    // ---- Asstin wanders ----
    var noise = document.getElementById('auNoise'), disp = document.getElementById('auDisp'), spr = document.getElementById('auSprite');
    var acur = { x: innerWidth * .5, y: innerHeight * .18 }, atgt = { x: acur.x, y: acur.y }, aSpeed = .05;
    function aRetarget() {
      var sw = spr.offsetWidth || 220;
      atgt.x = SAMSIDE.rand(sw * .5, innerWidth - sw * .5); atgt.y = SAMSIDE.rand(innerHeight * .04, innerHeight * .5);
      aSpeed = SAMSIDE.chance(.3) ? SAMSIDE.rand(.09, .16) : SAMSIDE.rand(.035, .07);
      setTimeout(aRetarget, SAMSIDE.rand(900, 2200));
    }
    aRetarget();

    // ---- attack sprites ----
    function img(name) { var i = new Image(); i.ok = false; i.onload = function () { i.ok = true; }; i.src = SAMSIDE.url('media/AUTIST/' + name); return i; }
    var SPR = { dew: img('dew_bottle.png'), marble: img('marble.png'), note: img('note.png'), horn: img('airhorn.png') };

    var cv = document.getElementById('cv'), cx = cv.getContext('2d'), W, H;
    function rs() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
    addEventListener('resize', rs); rs();
    var HIT_SFX = SAMSIDE.url('sfx/hit.mp3'), lastSfx = 0;
    var hp = 100, best = 0, t0 = performance.now(), last = t0, nextAtk = t0 + 1500, dead = 0, foes = [];
    var P = { x: W / 2, y: H * .78 }, T = { x: P.x, y: P.y }, mouse = true;
    function pt(e) { mouse = e.pointerType === 'mouse'; document.body.classList.toggle('mouse', mouse); T.x = e.clientX; T.y = e.clientY; if (mouse) { P.x = T.x; P.y = T.y; } }
    addEventListener('pointermove', pt); addEventListener('pointerdown', pt);
    function fmt(ms) { var s = ms / 1000; return ('0' + Math.floor(s / 60)).slice(-2) + ':' + ('0' + Math.floor(s % 60)).slice(-2) + '.' + Math.floor(s * 10 % 10); }
    function hurt(d) {
      hp -= d; var n = performance.now();
      if (n - lastSfx > 90) { lastSfx = n; sfx('hit.mp3', .2); }
    }
    var bx = function () { return acur.x; }, by = function () { return acur.y + (spr.offsetHeight || 0) * .8; };

    // ---- textures ----
    function noisePattern(hue, size) {
      var c = document.createElement('canvas'); c.width = c.height = size; var p = c.getContext('2d');
      for (var y = 0; y < size; y++) for (var x = 0; x < size; x++) { p.fillStyle = 'hsl(' + hue + ',70%,' + (35 + Math.random() * 30) + '%)'; p.fillRect(x, y, 1, 1); }
      return cx.createPattern(c, 'repeat');
    }
    var heartTex = noisePattern(0, 10), dewTex = noisePattern(100, 10);

    // ---- ATTACKS ----
    function dew() {
      sfx('milk.mp3', .25);
      var horiz = SAMSIDE.chance(.5), side = SAMSIDE.chance(.5), n = 1 + (SAMSIDE.chance(.4) ? 1 : 0);
      for (var i = 0; i < n; i++) foes.push({ k: 'dew', h: horiz, s: side, p: horiz ? P.y + SAMSIDE.rand(-90, 90) : P.x + SAMSIDE.rand(-90, 90), age: 0 });
    }
    function marbles() { sfx('gun_no_ammo.mp3', .5); for (var i = 0; i < 14; i++) { var a = Math.PI / 2 + SAMSIDE.rand(-1.1, 1.1), v = SAMSIDE.rand(160, 330); foes.push({ k: 'ball', x: bx(), y: by(), vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 12, life: 7 }); } }
    function notes() { [660, 740, 830].forEach(function (f) { beepNote(f); }); for (var i = 0; i < 9; i++) foes.push({ k: 'note', x: SAMSIDE.rand(20, W - 20), y: -20 - i * 40, vy: SAMSIDE.rand(150, 250), ph: SAMSIDE.rand(0, 6) }); }
    function horn() { sfx('airhorn.mp3', .1); var L = SAMSIDE.chance(.5); foes.push({ k: 'ring', x: L ? 0 : W, y: SAMSIDE.rand(H * .3, H * .9), r: 0 }); }
    var ATK = [dew, dew, marbles, notes, horn];

    function drawSprite(im, x, y, size, ang, fallback) {
      if (im.ok) { cx.save(); cx.translate(x, y); if (ang) cx.rotate(ang); cx.drawImage(im, -size / 2, -size / 2, size, size); cx.restore(); }
      else fallback();
    }

    // ---- deformed vision-blocking popups ----
    var POPUP_COUNT = 23;
    function spawnPopup() {
      var el = document.createElement('img'); el.className = 'au-popup no-drag'; el.draggable = false;
      el.src = SAMSIDE.url('media/POPUPS/p' + (1 + Math.floor(Math.random() * POPUP_COUNT)) + '.png');
      var w = SAMSIDE.rand(100, 240), h = SAMSIDE.rand(70, 210);
      el.style.width = w + 'px'; el.style.height = h + 'px';
      el.style.left = SAMSIDE.rand(0, Math.max(0, W - w)) + 'px'; el.style.top = SAMSIDE.rand(0, Math.max(0, H * .72 - h)) + 'px';
      el.style.transform = 'skew(' + SAMSIDE.rand(-25, 25) + 'deg) scale(' + SAMSIDE.rand(.7, 1.9) + ',' + SAMSIDE.rand(.7, 1.9) + ') rotate(' + SAMSIDE.rand(-14, 14) + 'deg)';
      el.onerror = function () { el.remove(); };
      document.getElementById('stg').appendChild(el);
      sfx('windows_error.mp3', .15);
      setTimeout(function () { el.style.opacity = 0; setTimeout(function () { el.remove(); }, 320); }, SAMSIDE.rand(1400, 2600));
    }
    (function popupLoop() { if (!dead) { spawnPopup(); if (SAMSIDE.chance(.45)) spawnPopup(); if (SAMSIDE.chance(.18)) spawnPopup(); } setTimeout(popupLoop, SAMSIDE.rand(1100, 2600)); })();

    function step(now) {
      var dt = Math.min(.05, (now - last) / 1000); last = now;
      var el = now - t0, min = Math.floor(el / 60000);

      // Asstin: lerp toward its wandering target, plus the sway/rotation, plus undulation
      acur.x += (atgt.x - acur.x) * aSpeed; acur.y += (atgt.y - acur.y) * aSpeed;
      var rot = Math.sin(now / 500) * 6;
      spr.style.transform = 'translate(' + (acur.x - spr.offsetWidth / 2) + 'px,' + acur.y + 'px) rotate(' + rot + 'deg)';
      noise.setAttribute('baseFrequency', (0.010 + 0.008 * Math.sin(now / 700)).toFixed(4) + ' ' + (0.016 + 0.010 * Math.cos(now / 530)).toFixed(4));
      disp.setAttribute('scale', (26 + 16 * Math.sin(now / 900)).toFixed(1));

      // BACKGROUND
      if (!step.hue) step.hue = 0;
      var chaosOn = now < (step.chaosUntil || 0);
      step.hue = (step.hue + (chaosOn ? 260 : 16) * dt) % 360;
      var sat = chaosOn ? 85 : 32, light = chaosOn ? 46 : 6;
      cx.fillStyle = 'hsl(' + step.hue.toFixed(1) + ',' + sat + '%,' + light + '%)'; cx.fillRect(0, 0, W, H);
      var redA = (min % 2 === 1) ? Math.max(0, Math.sin((el % 1000) / 1000 * Math.PI)) * .7 : 0;
      if (redA > 0) { cx.fillStyle = 'rgba(190,0,0,' + redA.toFixed(3) + ')'; cx.fillRect(0, 0, W, H); }
      if (!step.chaosNext || now > step.chaosNext) { step.chaosUntil = now + SAMSIDE.rand(1200, 2200); step.chaosNext = now + SAMSIDE.rand(7000, 14000); }

      if (!mouse) { var k = Math.min(1, dt * 10); P.x += (T.x - P.x) * k; P.y += (T.y - P.y) * k; }
      P.x = Math.max(8, Math.min(W - 8, P.x)); P.y = Math.max(8, Math.min(H - 8, P.y));

      if (!dead && now > nextAtk) { SAMSIDE.pick(ATK)(); nextAtk = now + SAMSIDE.rand(900, 2200) / (1 + Math.min(el / 240000, 1)); }
      cx.textAlign = 'center'; cx.textBaseline = 'middle';
      foes = foes.filter(function (f) {
        if (f.k === 'ball') {
          f.vy += 260 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.life -= dt;
          if (f.x < f.r || f.x > W - f.r) f.vx *= -1; if (f.y > H - f.r) { f.y = H - f.r; f.vy *= -.85; }
          drawSprite(SPR.marble, f.x, f.y, f.r * 2.4, Math.atan2(f.vy, f.vx), function () { cx.fillStyle = '#4af'; cx.beginPath(); cx.arc(f.x, f.y, f.r * .6, 0, 7); cx.fill(); });
          if (!dead && Math.hypot(f.x - P.x, f.y - P.y) < f.r) { hurt(5); return false; }
          return f.life > 0;
        }
        if (f.k === 'note') {
          f.y += f.vy * dt; var x = f.x + Math.sin(f.y / 40 + f.ph) * 40;
          drawSprite(SPR.note, x, f.y, 34, Math.sin(f.y / 60) * .3, function () { cx.fillStyle = '#fd3'; cx.font = '30px sans-serif'; cx.fillText('♪', x, f.y); });
          if (!dead && Math.hypot(x - P.x, f.y - P.y) < 16) { hurt(4); return false; }
          return f.y < H + 30;
        }
        if (f.k === 'ring') {
          f.r += 320 * dt; cx.strokeStyle = 'rgba(255,255,255,.85)'; cx.lineWidth = 8; cx.beginPath(); cx.arc(f.x, f.y, f.r, 0, 7); cx.stroke();
          var rx = Math.max(24, Math.min(W - 24, f.x));
          drawSprite(SPR.horn, rx, f.y, 46, 0, function () { cx.fillStyle = '#fff'; cx.font = '34px sans-serif'; cx.fillText('📯', rx, f.y); });
          if (!dead && Math.abs(Math.hypot(f.x - P.x, f.y - P.y) - f.r) < 12) hurt(.5);
          return f.r < Math.hypot(W, H);
        }
        // dew bottle + beam of liquid (textured)
        f.age += dt; var live = f.age > .9 && f.age < 1.4, th = 46;
        var bxp = f.h ? (f.s ? 26 : W - 26) : f.p, byp = f.h ? f.p : (f.s ? 26 : H - 26);
        if (f.age <= .9) { cx.fillStyle = 'rgba(255,60,60,.25)'; f.h ? cx.fillRect(0, f.p - th / 2, W, th) : cx.fillRect(f.p - th / 2, 0, th, H); }
        if (live) {
          cx.fillStyle = dewTex; f.h ? cx.fillRect(0, f.p - th / 2, W, th) : cx.fillRect(f.p - th / 2, 0, th, H);
          cx.fillStyle = 'rgba(230,255,200,.55)'; f.h ? cx.fillRect(0, f.p - 8, W, 16) : cx.fillRect(f.p - 8, 0, 16, H);
          if (!dead && (f.h ? Math.abs(P.y - f.p) < th / 2 + 4 : Math.abs(P.x - f.p) < th / 2 + 4)) hurt(.55);
        }
        drawSprite(SPR.dew, bxp, byp, 56, f.h ? (f.s ? Math.PI / 2 : -Math.PI / 2) : (f.s ? Math.PI : 0), function () {
          cx.save(); cx.translate(bxp, byp); cx.rotate(f.h ? (f.s ? Math.PI / 2 : -Math.PI / 2) : (f.s ? Math.PI : 0)); cx.fillStyle = '#3a3'; cx.fillRect(-14, -26, 28, 52); cx.fillStyle = dewTex; cx.fillRect(-14, -8, 28, 14); cx.fillStyle = '#080'; cx.fillRect(-6, -36, 12, 10); cx.restore();
        });
        return f.age < 1.5;
      });
      // soul
      cx.fillStyle = heartTex; cx.font = '22px sans-serif'; cx.fillText('♥', P.x, P.y);

      if (!dead && hp <= 0) {
        dead = 1; best = Math.max(best, el); document.getElementById('bs').textContent = 'BEST ' + fmt(best);
        document.getElementById('auMsg').style.display = 'flex';
        setTimeout(function () { hp = 100; foes = []; t0 = performance.now(); nextAtk = t0 + 1500; dead = 0; document.getElementById('auMsg').style.display = 'none'; }, 1400);
      }
      var h = Math.max(0, hp); document.getElementById('hpN').textContent = Math.ceil(h); document.getElementById('hpB').style.width = h + '%';
      if (!dead) document.getElementById('tm').textContent = fmt(el);
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  </script>
</body>
</html>
