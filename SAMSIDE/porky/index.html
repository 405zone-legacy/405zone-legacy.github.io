<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Porky</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="stylesheet" href="../css/samside-base.css">
  <script src="../js/samside-base.js"></script>
  <style>
    .console-wrap {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: #000;
    }
    .console-line {
      font-size: clamp(1rem, 2.2vw, 1.5rem);
      color: #0f0;
      text-shadow: 0 0 6px rgba(0,255,0,.5);
      letter-spacing: 1px;
    }
    .console-spinner { display: inline-block; width: 1.2ch; }
  </style>
</head>
<body>
  <div class="console-wrap">
    <div class="console-line">Porky.jar was not found<span id="dots">...</span><span class="console-spinner" id="spin">\</span></div>
  </div>
  <script>
    var dotsEl = document.getElementById('dots');
    var spinEl = document.getElementById('spin');
    var frames = ['\\', '|', '/', '-'];
    var f = 0;
    setInterval(function () {
      spinEl.textContent = frames[f % frames.length];
      f++;
    }, 180);

    SAMSIDE.redirectAfter(60000, '../legacy/');
  </script>
</body>
</html>
