<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESIDUES</title>
  <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
  <link rel="stylesheet" href="../../../css/samside-base.css">
  <script src="../../../js/samside-base.js"></script>
  <style>
    .pg-sprite {
      position: absolute;
      width: clamp(140px, 16vw, 260px);
      height: clamp(140px, 16vw, 260px);
      object-fit: contain;
      transition: left 3.5s ease-in-out, top 3.5s ease-in-out;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <div class="samside-stage" id="pgStage"></div>
  <script>
    var track = SAMSIDE.bgm(SAMSIDE.url('sfx/B4D_G4T3W4Y.mp3'), { loop: true, volume: .35 });
    var ctx, ready = false;
    function initDistortion() {
      if (ready || !track) return; ready = true;
      try {
        var Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
        ctx = new Ctx();
        var src = ctx.createMediaElementSource(track);
        var shaper = ctx.createWaveShaper(), n = 44100, curve = new Float32Array(n), amt = 55;
        for (var i = 0; i < n; i++) { var x = (i * 2) / n - 1; curve[i] = (3 + amt) * x * (Math.PI / (Math.PI + amt * Math.abs(x))); }
        shaper.curve = curve; shaper.oversample = '4x';
        var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
        var gain = ctx.createGain(); gain.gain.value = .9;
        src.connect(shaper); shaper.connect(lp); lp.connect(gain); gain.connect(ctx.destination);
        ctx.resume(); track.play().catch(function () {});
      } catch (e) {}
    }

    if (location.protocol !== 'file:') {
      ['click', 'keydown', 'touchend', 'pointerup'].forEach(function (ev) { document.addEventListener(ev, initDistortion); });
      initDistortion();
    }

    var VARIANTS = [
      '../../../media/residue1.png',
      '../../../media/residue2.png'
    ];
    var COUNT = 10;
    var SWAP_INTERVAL = 1400;
    var WANDER_INTERVAL = 3800;

    var stage = document.getElementById('pgStage');
    var sprites = [];

    function randomVariant() {
      return VARIANTS[Math.floor(Math.random() * VARIANTS.length)];
    }

    for (var i = 0; i < COUNT; i++) {
      var img = document.createElement('img');
      img.className = 'pg-sprite no-drag';
      img.src = randomVariant();
      img.onerror = function () { this.style.display = 'none'; };
      stage.appendChild(img);
      SAMSIDE.randomPosition(img, 80);
      sprites.push(img);

      (function (img) {
        setInterval(function () { img.src = randomVariant(); }, SWAP_INTERVAL + Math.random() * 900);
      })(img);
    }

    function wander() {
      sprites.forEach(function (s) { SAMSIDE.randomPosition(s, 80); });
    }
    setInterval(wander, WANDER_INTERVAL);
  </script>
</body>
</html>
