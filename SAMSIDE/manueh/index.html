<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>manueh</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="stylesheet" href="../css/samside-base.css">
  <script src="../js/samside-base.js"></script>
  <style>
    .manueh-bg {
      position: absolute; inset: 0;

      background-image: url('../media/ORANGE.png');
      background-size: cover; background-position: center;
    }

    .manueh-gradient {
      position: absolute; inset: 0;
      background: linear-gradient(160deg,
        rgba(0,0,0,.92) 0%,
        rgba(20,6,0,.75) 35%,
        rgba(180,60,0,.55) 70%,
        rgba(255,123,0,.4) 100%
      );
    }

  </style>
</head>
<body>
  <div class="samside-stage">
    <div class="manueh-bg no-drag"></div>
    <div class="manueh-gradient"></div>
  </div>
</body>
</html>
