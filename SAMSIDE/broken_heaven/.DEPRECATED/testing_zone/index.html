<!DOCTYPE html>
<html lang="es" class="gb-green">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TESTING_ZONE</title>
  <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
  <link rel="stylesheet" href="../../../css/samside-base.css">
  <link rel="stylesheet" href="../../../css/samside-gb.css">
  <script src="../../../js/samside-base.js"></script>
  <script src="../../../js/samside-gb.js"></script>
  <style>
    .tz-floor {
      background-image: var(--sp-zone_bg, url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2016%2016%27%20shape-rendering%3D%27crispEdges%27%3E%3Crect%20width%3D%2716%27%20height%3D%2716%27%20fill%3D%27%233a3a3a%27/%3E%3Crect%20width%3D%278%27%20height%3D%278%27%20fill%3D%27%234a4a4a%27/%3E%3Crect%20x%3D%278%27%20y%3D%278%27%20width%3D%278%27%20height%3D%278%27%20fill%3D%27%234a4a4a%27/%3E%3Crect%20width%3D%2716%27%20height%3D%271%27%20fill%3D%27%232a2a2a%27/%3E%3Crect%20width%3D%271%27%20height%3D%2716%27%20fill%3D%27%232a2a2a%27/%3E%3C/svg%3E"));
      background-size: var(--bg-size, 64px 64px);
    }
    .tz-frame {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      box-shadow: inset 0 0 0 .5rem var(--gb1), inset 0 0 0 .8rem var(--gb3), inset 0 0 0 1.1rem var(--gb0);
    }
    .tz-hud {
      position: absolute; left: 1.8rem; top: 1.5rem; z-index: 2;
      font-size: clamp(.65rem, 1.8vmin, .95rem); letter-spacing: 2px; color: var(--gb3);
      text-shadow: .12rem .12rem 0 var(--gb0);
    }
    .tz-postit {
      position: absolute; z-index: 3;
      width: var(--pw, 150px); height: var(--pw, 150px);
      padding: .7em;
      isolation: isolate; overflow: hidden;
      background: var(--gb3); color: var(--gb0);
      border: .15rem solid var(--gb0);
      box-shadow: .3rem .3rem 0 var(--gb0);
      transform: rotate(var(--rot, 0deg));
      font-size: clamp(.6rem, 1.7vmin, .85rem); line-height: 1.35; letter-spacing: .5px;
      word-break: break-word; pointer-events: none;
    }
    .tz-postit::before {
      content: ''; position: absolute; inset: 0; z-index: -1;
      background: var(--sp-postit, none) center / 100% 100% no-repeat;
      image-rendering: pixelated; filter: url(#gbTint);
    }
    .tz-ghost {
      position: absolute; z-index: 5; display: block;
      width: clamp(52px, 8vmin, 84px); height: clamp(52px, 8vmin, 84px);
      transition: left 1.2s ease-in-out, top 1.2s ease-in-out;
    }
  </style>
</head>
<body>
  <div class="gb-stage tz-stage" id="tzStage">
    <div class="gb-wall tz-floor"></div>
    <div class="tz-frame"></div>
    <p class="tz-hud">[TESTING_ZONE]</p>
    <div id="tzNotes"></div>
    <a class="tz-ghost" id="tzGhost" href="console_chat/" tabindex="-1" aria-hidden="true" draggable="false"></a>
    <div class="gb-overlay"></div>
  </div>
  <script>
    SAMSIDE_GB.init('green', ['zone_bg', 'postit']);
    SAMSIDE.bgm(SAMSIDE.url('sfx/C0R3_L4ND.mp3'), { loop: true, volume: .18 });

    /* ---------- POST-ITS ----------*/
    var POSTIT_CHANCE = .6;
    var POSTIT_MAX = 4;
    var POSTIT_MESSAGES = [
      "PG#405: DON'T FORGET TO REBOOT HER.",
      "WHO KEEPS DUPLICATING THE TASKS?!",
      "PG#1241: J.java IS NOT MY FAULT.",
      "THE [CORE] FEELS WARM AGAIN...",
      "PG#520: STOP TOUCHING MY CODE!",
      "WHEELFORM ASKED ABOUT THE BEAR. AGAIN.",
      "// TODO: FIX THE [TESTING_ZONE]",
      "IF YOU READ THIS, IT WAS NOT ME.",
      "SOMETHING IS WATCHING THE CONSOLE.",
      "PG#1020 SAYS THE GHOSTWARE WAVED AT HIM.",
      "DO NOT CLICK THE THING THAT ISN'T THERE.",
      "I FORGOT TO PATCH SOMETHING!",
      "ANYBODY KNOWS HOW DO I TYPE THE '@'?",
      "IS IT ME OR SMELLS LIKE A GAS STATION IN HERE?",
      "BRO!!! STOP THAT!!",
      "PG#274648: WHY DID YOU PUT ME SUCH A LARGE ID? ... DO THESE HAVE EVEN SENSE AT ALL?!",
      "TO THE ONE THAT PUT A ':3' IN THE COMMENTS IS GOING TO BE KICKED IN THE [###] SO HARD!",
      "WHEELFORM WAS HERE! ;3 // NO! YOU WEREN'T!! -PG#405;",
      "A PROGRAM IS TALKING TO ME! HE SAIS THAT I OWE MONEY TO IT!! :O",
      ":)",
      ".... . .-.. .-.. --- / .-- --- .-. .-.. -..",
      "I WAS NOT THERE."
    ];

    var stage = document.getElementById('tzStage');
    var notesBox = document.getElementById('tzNotes');
    var notes = [];

    if (SAMSIDE.chance(POSTIT_CHANCE)) {
      var pool = POSTIT_MESSAGES.slice().sort(function () { return Math.random() - .5; });
      var count = 1 + Math.floor(Math.random() * POSTIT_MAX);
      for (var i = 0; i < count; i++) {
        var el = document.createElement('div');
        el.className = 'tz-postit';
        el.hidden = true;
        el.textContent = pool[i];
        el.style.setProperty('--rot', SAMSIDE.rand(-4, 4).toFixed(1) + 'deg');
        notesBox.appendChild(el);
        notes.push(el);
      }
    }

    function layoutNotes() {
      var vw = window.innerWidth, vh = window.innerHeight;
      var size = Math.round(Math.max(110, Math.min(190, Math.min(vw, vh) * .26)));
      var m = 14, top = 56, placed = [];
      stage.style.setProperty('--pw', size + 'px');
      notes.forEach(function (el) {
        var ok = false;
        for (var t = 0; t < 250 && !ok; t++) {
          var x = SAMSIDE.rand(m + 12, vw - size - m - 12);
          var y = SAMSIDE.rand(top, vh - size - m - 12);
          var free = placed.every(function (r) {
            return x + size + m <= r.x || r.x + size + m <= x || y + size + m <= r.y || r.y + size + m <= y;
          });
          if (free) {
            placed.push({ x: x, y: y });
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            ok = true;
          }
        }
        el.hidden = !ok;
      });
    }
    layoutNotes();
    var rt = null;
    window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(layoutNotes, 200); });

    var ghost = document.getElementById('tzGhost');
    function moveGhost() {
      var s = ghost.offsetWidth;
      ghost.style.left = SAMSIDE.rand(0, Math.max(0, window.innerWidth - s)) + 'px';
      ghost.style.top = SAMSIDE.rand(0, Math.max(0, window.innerHeight - s)) + 'px';
    }
    moveGhost();
    setInterval(moveGhost, 1500);
  </script>
</body>
</html>
