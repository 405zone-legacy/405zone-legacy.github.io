<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MISSINGNO</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="stylesheet" href="../css/samside-base.css">
  <script src="../js/samside-base.js"></script>
  <style>
    body { overflow: hidden; }
    .flappy-wrap { position: relative; width: 100%; height: 100%; }
    #flappyCanvas { display: block; margin: 0 auto; background: #000; touch-action: none; pointer-events: auto; }
    .flappy-score {
      position: absolute; top: 3vh; left: 50%; transform: translateX(-50%);
      font-size: clamp(1.4rem, 3vw, 2.2rem); letter-spacing: 3px; color: #fff;
      text-shadow: 0 0 8px rgba(0,0,0,.9); pointer-events: none; z-index: 2;
    }
    .flappy-hint {
      position: absolute; bottom: 4vh; left: 50%; transform: translateX(-50%);
      font-size: .8rem; letter-spacing: 2px; opacity: .75; pointer-events: none; z-index: 2;
    }

    .flappy-usucc {
      position: absolute;
      right: 6vw;
      bottom: -100vh;
      width: clamp(240px, 34vw, 520px);
      height: auto;
      z-index: 1;
      pointer-events: none;
      transition: bottom 1.1s cubic-bezier(.2, .8, .2, 1);
    }
    .flappy-usucc.rise {
      bottom: -8vh;                /* PEDRO U_SUCC MANAGER */
    }

    .flappy-mute {
      position: absolute;
      top: 3vh;
      right: 3vw;
      z-index: 3;
      pointer-events: auto;
      cursor: pointer;
      background: transparent;
      border: 1px solid rgba(255,255,255,.4);
      color: #fff;
      font-family: 'VCR_OSD_MONO', monospace;
      font-size: .7rem;
      letter-spacing: 1px;
      padding: .35em .7em;
      opacity: .7;
    }
    .flappy-mute:hover { opacity: 1; }

    .flappy-preload {
      position: absolute; inset: 0; z-index: 4;
      display: flex; align-items: center; justify-content: center;
      background: #000;
      font-size: .8rem; letter-spacing: 2px; color: #fff; opacity: .7;
      transition: opacity .3s ease;
    }
    .flappy-preload.is-hidden { opacity: 0; pointer-events: none; }

    .flappy-hint-mobile { display: none; }
    @media (hover: none) and (pointer: coarse) {
      .flappy-hint-desktop { display: none; }
      .flappy-hint-mobile { display: inline; }
    }
  </style>
</head>
<body>
  <div class="flappy-wrap">
    <div class="flappy-preload" id="flappyPreload">LOADING...</div>
    <div class="flappy-score" id="flappyScore">0</div>
    <button class="flappy-mute" id="flappyMute" type="button">MUSIC: OFF</button>
    <canvas id="flappyCanvas"></canvas>

    <img class="flappy-usucc no-drag" id="usuccSprite" src="../media/u_succ.png" alt="" draggable="false">
    <div class="flappy-hint">
      <span class="flappy-hint-desktop">[ CLICK / SPACE ] to fly — [ R ] to restart</span>
      <span class="flappy-hint-mobile">[ TAP ] to fly / restart</span>
    </div>
  </div>
  <script>
    var canvas = document.getElementById('flappyCanvas');
    var ctx = canvas.getContext('2d');
    var scoreEl = document.getElementById('flappyScore');
    var usuccEl = document.getElementById('usuccSprite');
    var muteBtn = document.getElementById('flappyMute');
    var preloadEl = document.getElementById('flappyPreload');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    var RODOLFO_SRC   = '../media/rodolfo.png';
    var BG_TEXTURE_SRC   = '../media/MISSINGNO/bg_texture.png';
    var PIPE_TEXTURE_SRC = '../media/MISSINGNO/pipe_texture.png';
    var BG_MUSIC_SRC     = '../sfx/rodolfos_epic_flight.mp3';
    var FLAP_SFX_SRC     = '../sfx/flap.mp3';
    var HIT_SFX_SRC      = '../sfx/hit.mp3';
    var DEATH_JINGLE_SRC = '../sfx/u_succ.mp3';

    function loadImage(src, onSettle) {
      var img = new Image();
      var state = { img: img, loaded: false };
      function settle() { if (onSettle) onSettle(); }
      img.onload = function () { state.loaded = true; settle(); };
      img.onerror = function () { settle(); };
      img.src = src;
      return state;
    }

    var assetsPending = 3;
    function assetSettled() {
      assetsPending--;
      if (assetsPending <= 0) {
        preloadEl.classList.add('is-hidden');
        draw();
      }
    }

    var rodolfo_ = loadImage(RODOLFO_SRC, assetSettled);
    var bgTexture = loadImage(BG_TEXTURE_SRC, assetSettled);
    var pipeTexture = loadImage(PIPE_TEXTURE_SRC, assetSettled);

    var bgMusic = null;
    var musicOn = false;
    function ensureMusicStarted() {
      if (bgMusic) return;
      bgMusic = SAMSIDE.playSafe(BG_MUSIC_SRC, { loop: true, volume: .2 });
      musicOn = !!bgMusic;
      updateMuteLabel();
    }
    function toggleMusic() {
      if (!bgMusic) { ensureMusicStarted(); return; }
      musicOn = !musicOn;
      if (musicOn) bgMusic.play().catch(function () {});
      else bgMusic.pause();
      updateMuteLabel();
    }
    function updateMuteLabel() {
      muteBtn.textContent = 'MUSIC: ' + (musicOn ? 'ON' : 'OFF');
    }
    muteBtn.addEventListener('click', toggleMusic);

    var GRAVITY = 1400;
    var FLAP_VELOCITY = -430;
    var PIPE_GAP = 190;
    var PIPE_WIDTH = 70;
    var PIPE_SPEED = 220;
    var PIPE_INTERVAL = 1500;

    var state, rodolfo, pipes, lastPipeTime, score, lastTime, usuccTimer;
    var deathJingle = null;

    function reset() {
      state = 'ready'; // ready | playing | dead
      rodolfo = {
        x: canvas.width * 0.28, y: canvas.height / 2, vy: 0,

        visualSize: 58,
        hitSize: 30
      };
      pipes = [];
      lastPipeTime = 0;
      score = 0;
      scoreEl.textContent = '0';
      lastTime = null;
      // FIXED PEDRO PAQUETE SOFTLOCK! :3c
      clearTimeout(usuccTimer);
      if (usuccEl) usuccEl.classList.remove('rise');
      // STOP THE "U_SUCC.MP3" SFX XD
      if (deathJingle) {
        deathJingle.pause();
        deathJingle.currentTime = 0;
        deathJingle = null;
      }
    }
    reset();

    function flap() {
      if (state === 'ready') { state = 'playing'; lastPipeTime = performance.now(); lastTime = performance.now(); requestAnimationFrame(loop); }
      if (state === 'dead') { reset(); return; }
      rodolfo.vy = FLAP_VELOCITY;
      SAMSIDE.playSafe(FLAP_SFX_SRC, { volume: .8 });
    }

    function spawnPipe() {
      var margin = 60;
      var top = margin + Math.random() * (canvas.height - PIPE_GAP - margin * 2);
      pipes.push({ x: canvas.width + PIPE_WIDTH, top: top, passed: false });
    }

    function update(dt, now) {
      rodolfo.vy += GRAVITY * dt;
      rodolfo.y += rodolfo.vy * dt;

      if (now - lastPipeTime > PIPE_INTERVAL) {
        spawnPipe();
        lastPipeTime = now;
      }

      pipes.forEach(function (p) { p.x -= PIPE_SPEED * dt; });
      pipes = pipes.filter(function (p) { return p.x > -PIPE_WIDTH; });

      pipes.forEach(function (p) {
        if (!p.passed && p.x + PIPE_WIDTH < rodolfo.x) {
          p.passed = true;
          score++;
          scoreEl.textContent = String(score);
        }
      });

      var hit = rodolfo.hitSize;
      if (rodolfo.y + hit / 2 > canvas.height || rodolfo.y - hit / 2 < 0) {
        die();
      }
      pipes.forEach(function (p) {
        var withinX = rodolfo.x + hit / 2 > p.x && rodolfo.x - hit / 2 < p.x + PIPE_WIDTH;
        if (withinX) {
          var withinGap = rodolfo.y - hit / 2 > p.top && rodolfo.y + hit / 2 < p.top + PIPE_GAP;
          if (!withinGap) die();
        }
      });
    }

    function die() {
      if (state === 'dead') return;
      state = 'dead';

      SAMSIDE.playSafe(HIT_SFX_SRC, { volume: 1 });
      deathJingle = SAMSIDE.playSafe(DEATH_JINGLE_SRC, { volume: 1 }); // "you lost" jingle

      usuccTimer = setTimeout(function () { usuccEl.classList.add('rise'); }, 250);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // BG
      if (bgTexture.loaded) {
        ctx.drawImage(bgTexture.img, 0, 0, canvas.width, canvas.height);
      }

      // Pipes
      var pipeFill = null;
      if (pipeTexture.loaded) {
        pipeFill = ctx.createPattern(pipeTexture.img, 'repeat');
      }
      ctx.fillStyle = pipeFill || '#2ecc71';
      pipes.forEach(function (p) {
        ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
        ctx.fillRect(p.x, p.top + PIPE_GAP, PIPE_WIDTH, canvas.height - (p.top + PIPE_GAP));
      });

      if (rodolfo_.loaded) {
        ctx.save();
        ctx.translate(rodolfo.x, rodolfo.y);
        var angle = Math.max(-0.5, Math.min(0.9, rodolfo.vy / 800));
        ctx.rotate(angle);
        ctx.drawImage(rodolfo_.img, -rodolfo.visualSize / 2, -rodolfo.visualSize / 2, rodolfo.visualSize, rodolfo.visualSize);
        ctx.restore();
      }

      if (state === 'ready') {
        ctx.fillStyle = '#fff';
        ctx.font = '18px VCR_OSD_MONO, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('CLICK / TAP / SPACE TO START', canvas.width / 2, canvas.height * 0.35);
      }
      if (state === 'dead') {
        ctx.fillStyle = '#ff5555';
        ctx.font = '22px VCR_OSD_MONO, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height * 0.4);
        ctx.font = '14px VCR_OSD_MONO, monospace';
        ctx.fillStyle = '#fff';
        ctx.fillText('[ R ] OR CLICK TO RETRY', canvas.width / 2, canvas.height * 0.4 + 30);
      }
    }

    function loop(now) {
      if (state !== 'playing') { draw(); return; }
      var dt = Math.min(.033, (now - lastTime) / 1000);
      lastTime = now;
      update(dt, now);
      draw();
      requestAnimationFrame(loop);
    }

    canvas.addEventListener('mousedown', function () { ensureMusicStarted(); flap(); });
    canvas.addEventListener('touchstart', function (e) { e.preventDefault(); ensureMusicStarted(); flap(); }, { passive: false });
    document.addEventListener('keydown', function (e) {
      if (e.code === 'Space') { e.preventDefault(); ensureMusicStarted(); flap(); }
      if (e.key === 'r' || e.key === 'R') reset();
    });
  </script>
</body>
</html>
