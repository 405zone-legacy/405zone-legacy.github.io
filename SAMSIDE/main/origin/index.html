  <style>
    html, body { background: #000; }
    .og-bg { opacity: .12; }

      position: fixed; inset: 0; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      padding: clamp(.6rem, 2.5vmin, 2rem);
    }
    .og-panel {
      position: relative;
      width: min(96vw, 1180px); height: min(94vh, 860px);
      background: rgba(0,8,0,.92);
      border: 2px solid #0f0; box-shadow: 0 0 22px rgba(0,255,0,.35), inset 0 0 40px rgba(0,255,0,.06);
      color: #0f0; font-family: inherit;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .og-titlebar {
      flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 1em;
      padding: .5em .8em; border-bottom: 1px solid #0f0; font-size: clamp(.7rem, 1.6vw, .95rem);
      letter-spacing: 2px;
    }
    #ogPath { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #ogClock { flex: 0 0 auto; }
    .og-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: clamp(.8rem, 3vw, 2rem); }
    /* CMD-styled scrollbar, since scrolling in here is unavoidable */
    .og-body { scrollbar-width: thin; scrollbar-color: #0f0 #001500; }
    .og-body::-webkit-scrollbar { width: 10px; }
    .og-body::-webkit-scrollbar-track { background: #001500; }
    .og-body::-webkit-scrollbar-thumb { background: #0f0; box-shadow: inset 0 0 0 1px #000; }
    .og-body::-webkit-scrollbar-thumb:hover { background: #4f4; }

    .og-back {
      background: none; border: 1px solid #0f0; color: #0f0; font: inherit; font-size: .85em;
      padding: .3em .8em; cursor: pointer; margin-bottom: 1.2em;
    }
    .og-back:hover, .og-back:focus-visible { background: #0f0; color: #000; }

    /* ---------- MENU ---------- */
    .og-menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1.4rem; }
    .og-menu-item { background: none; border: 1px solid #0f0; color: #0f0; font: inherit; cursor: pointer; padding: 1.1em .6em; text-align: center; }
    .og-menu-item:hover, .og-menu-item:focus-visible { background: rgba(0,255,0,.12); }
    .og-menu-item .og-mi-tag { display: block; font-size: 1.05em; letter-spacing: 2px; margin-bottom: .3em; }
    .og-menu-sub { min-height: 1.6em; text-align: center; margin-top: 1.6rem; font-size: .8em; opacity: .8; letter-spacing: 1px; }

    /* ---------- UNIVERSE VIEW ---------- */
    .og-u-row { display: flex; gap: clamp(1rem, 3vw, 2.4rem); align-items: flex-start; margin-bottom: 1.6em; }
    .og-u-text { flex: 1 1 0; min-width: 0; }
    .og-u-title { font-size: clamp(1.1rem, 3vw, 1.7rem); letter-spacing: 2px; margin-bottom: .5em; }
    .og-u-line { margin-bottom: .4em; font-size: .95em; }
    .og-u-frame {
      flex: 0 0 auto; width: clamp(120px, 22vw, 260px); aspect-ratio: 1;
      border: 1px solid #0f0; display: flex; align-items: center; justify-content: center; background: #000;
    }
    .og-u-frame img { max-width: 100%; max-height: 100%; object-fit: contain; filter: url(#ogImgFx); }
    @media (max-width: 620px) {
      .og-u-row { flex-direction: column; }
      .og-u-frame { align-self: center; width: min(50vw, 200px); }
    }

    .og-accordion { border-top: 1px dashed rgba(0,255,0,.4); margin-top: 1em; }
    .og-acc-head {
      width: 100%; background: none; border: 0; color: #0f0; font: inherit; text-align: left; cursor: pointer;
      padding: .7em 0; font-size: .95em; letter-spacing: 1px; display: flex; align-items: center; gap: .5em;
    }
    .og-acc-head::before { content: '▶'; font-size: .7em; transition: transform .15s; }
    .og-acc-head.open::before { transform: rotate(90deg); }
    .og-acc-body { display: none; padding: 0 0 1em .2em; }
    .og-acc-body.open { display: block; }

    .og-victims { list-style: none; padding: 0; margin: 0; columns: 2; column-gap: 2em; font-size: .85em; opacity: .85; }
    .og-victims li { margin-bottom: .4em; break-inside: avoid; }

    .og-ev-row { display: flex; align-items: baseline; gap: .5em; padding: .35em 0; font-size: .85em; }
    .og-ev-row.clickable { cursor: pointer; }
    .og-ev-row.clickable:hover .og-ev-tag { text-decoration: underline; }
    .og-ev-row:not(.clickable) { opacity: .62; }
    .og-ev-dots { flex: 1 1 auto; border-bottom: 2px dotted currentColor; height: 0; align-self: center; min-width: 1em; }
    .og-ev-date { flex: 0 0 auto; white-space: nowrap; }

    /* ---------- EVENT VIEW ---------- */
    .og-ev-title { text-align: center; font-size: clamp(1.1rem, 3.2vw, 1.8rem); letter-spacing: 2px; margin-bottom: 1.2em; }
    .og-ev-body-row { display: flex; gap: clamp(1rem, 3vw, 2.4rem); align-items: flex-start; }
    .og-ev-bullets { flex: 1 1 0; min-width: 0; list-style: none; padding: 0; margin: 0; }
    .og-ev-bullets li { margin-bottom: 1em; font-size: .92em; line-height: 1.6; }
    .og-ev-bullets li::before { content: '– '; opacity: .7; }
    .og-ev-frame {
      flex: 0 0 auto; width: clamp(130px, 24vw, 280px); aspect-ratio: 1;
      border: 1px solid #0f0; display: flex; align-items: center; justify-content: center; background: #000;
    }
    .og-ev-frame img { max-width: 100%; max-height: 100%; object-fit: contain; filter: url(#ogImgFx); }
    @media (max-width: 620px) {
      .og-ev-body-row { flex-direction: column; }
      .og-ev-frame { align-self: center; width: min(50vw, 220px); }
    }

    /* glitch text: base character occasionally swapped for garbage */
    .og-glitch { color: #f22; }

    /* password dialog (for BREACHES > [THE_PLAN]) */
    .og-pw-wrap { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.8); }
    .og-pw-wrap.on { display: flex; }
    .og-pw { background: #000; border: 2px solid #0f0; padding: 1.2rem 1.4rem; color: #0f0; text-align: center; max-width: 90vw; }
    .og-pw input { background: #000; color: #0f0; border: 1px solid #0f0; font: inherit; padding: .3rem; width: 11ch; margin: 0 .4rem; }
    .og-pw button { background: #000; color: #0f0; border: 1px solid #0f0; font: inherit; padding: .3rem .7rem; cursor: pointer; }
    .og-pw p { margin: .6rem 0 0; color: #f33; min-height: 1.2em; }
    .og-shake { animation: og-shake .3s; }
    @keyframes og-shake { 25% { margin-left: -8px } 75% { margin-left: 8px } }
  </style>

    /* ============ GLITCH TEXT ENGINE ============ */
    var GLYPHS = '#%$&@?¿!*x01_-~^░▒▓■';
    function appendGlitchText(parent, str) {
      var re = /\{([^}]*)\}/g, last = 0, m;
      while ((m = re.exec(str))) {
        if (m.index > last) parent.appendChild(document.createTextNode(str.slice(last, m.index)));
        var span = document.createElement('span'); span.className = 'og-glitch'; span.dataset.base = m[1]; span.textContent = m[1];
        parent.appendChild(span);
        last = re.lastIndex;
      }
      if (last < str.length) parent.appendChild(document.createTextNode(str.slice(last)));
    }
    setInterval(function () {
      document.querySelectorAll('.og-glitch').forEach(function (el) {
        if (!SAMSIDE.chance(.35)) { el.textContent = el.dataset.base; return; }
        var a = el.dataset.base.split('');
        for (var i = 0; i < Math.max(1, Math.floor(a.length * .25)); i++) { var p = Math.floor(Math.random() * a.length); if (a[p] !== ' ') a[p] = GLYPHS[Math.floor(Math.random() * GLYPHS.length)]; }
        el.textContent = a.join('');
      });
    }, 160);

    /* ============ IMAGE WITH FALLBACK CHAIN ============ */
    function ogImg(parent, id) {
      var img = document.createElement('img'); img.draggable = false; img.alt = '';
      img.onerror = function () {
        if (img.dataset.stage !== 'placeholder') { img.dataset.stage = 'placeholder'; img.src = SAMSIDE.url('media/origin/placeholder.png'); }
        else img.remove();
      };
      img.src = SAMSIDE.url('media/origin/' + id + '.png');
      parent.appendChild(img);
    }

    /* ============ NAVIGATION ============ */
    var body = document.getElementById('ogBody');
    function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }
    function setPath(text) { document.getElementById('ogPath').textContent = text; }

    var actx;
    function playClick() {try { var a = new Audio(KEY_SFX); a.volume = 0.25; a.play().catch(function () {}); } catch (e) {}}
    function onClick(el, fn) { el.addEventListener('click', function (e) { playClick(); fn(e); }); }

    function backBtn(onClick_) {
      var b = document.createElement('button'); b.className = 'og-back'; b.type = 'button'; b.textContent = '< BACK';
      onClick(b, onClick_); return b;
    }
    function allSections() { return UNIVERSES.concat([BREACHES]); }
    function findSection(id) { return allSections().filter(function (u) { return u.id === id; })[0]; }

    // remembers which accordions were left open per universe, so BACK doesn't collapse them
    var accState = {};   // { [universeId]: { victims: bool, events: bool } }
    function stateFor(uid) { return accState[uid] || (accState[uid] = { victims: false, events: false }); }

    
    var currentView = { type: 'menu' };
    var ghostEl = null, ghostTimer = null;
    function removeGhost() { if (ghostTimer) { clearTimeout(ghostTimer); ghostTimer = null; } if (ghostEl) { ghostEl.remove(); ghostEl = null; } }

    function renderMenu() {
      removeGhost(); currentView = { type: 'menu' };
      setPath('C:\\ORIGIN>');
      clear(body);
      var grid = document.createElement('div'); grid.className = 'og-menu-grid';
      var sub = document.createElement('p'); sub.className = 'og-menu-sub';
      allSections().forEach(function (u) {
        var btn = document.createElement('button'); btn.className = 'og-menu-item'; btn.type = 'button';
        var t = document.createElement('span'); t.className = 'og-mi-tag'; t.textContent = u.tag; btn.appendChild(t);
        appendGlitchText(btn, u.status.replace(/;$/, ''));
        btn.addEventListener('mouseenter', function () { clear(sub); appendGlitchText(sub, u.desc); });
        btn.addEventListener('focus', function () { clear(sub); appendGlitchText(sub, u.desc); });
        btn.addEventListener('mouseleave', function () { clear(sub); });
        onClick(btn, function () { renderUniverse(u.id); });
        grid.appendChild(btn);
      });
      body.appendChild(grid); body.appendChild(sub);
      body.scrollTop = 0;
    }

    function toggleAcc(head, panel, persistFlagSetter) {
      var open = panel.classList.toggle('open'); head.classList.toggle('open', open);
      if (persistFlagSetter) persistFlagSetter(open);
    }

    function renderUniverse(uid) {
      var u = findSection(uid); if (!u) return renderMenu();
      removeGhost(); currentView = { type: 'universe', uid: uid };
      setPath('C:\\ORIGIN\\' + u.tag + '>');
      var st = stateFor(uid);
      clear(body);
      body.appendChild(backBtn(renderMenu));

      var row = document.createElement('div'); row.className = 'og-u-row';
      var text = document.createElement('div'); text.className = 'og-u-text';

      var status = document.createElement('div'); status.className = 'og-u-line'; appendGlitchText(status, u.status); text.appendChild(status);
      row.appendChild(text);

      var panelV = document.createElement('div'); panelV.className = 'og-acc-body';

      panelV.appendChild(ul);

      if (st.victims) { panelV.classList.add('open'); headV.classList.add('open'); }

      var headE = document.createElement('button'); headE.className = 'og-acc-head'; headE.type = 'button'; headE.textContent = 'EVENTS';

        var clickable = !!(ev.bullets && ev.bullets.length) || !!ev.special;

        var tag = document.createElement('span'); tag.className = 'og-ev-tag'; appendGlitchText(tag, ev.tag); r.appendChild(tag);
        if (ev.date) {
          var dots = document.createElement('span'); dots.className = 'og-ev-dots'; r.appendChild(dots);
          var date = document.createElement('span'); date.className = 'og-ev-date'; date.appendChild(document.createTextNode('(')); appendGlitchText(date, ev.date); date.appendChild(document.createTextNode(')')); r.appendChild(date);
        }
        if (clickable) onClick(r, function () { openEvent(u, ev); });
        panelE.appendChild(r);
      });
      onClick(headE, function () { toggleAcc(headE, panelE, function (open) { st.events = open; }); });
      if (st.events) { panelE.classList.add('open'); headE.classList.add('open'); }
      accE.appendChild(headE); accE.appendChild(panelE); body.appendChild(accE);

      body.scrollTop = 0;
    }

    function openEvent(u, ev) {
      if (ev.special === 'password') return openPassword();
      if (ev.special === 'hb') return void (window.location.href = SAMSIDE.url('main/hb/'));
      renderEvent(u, ev);
    }

    function renderEvent(u, ev) {
      removeGhost(); currentView = { type: 'event', uid: u.id, ev: ev };
      setPath('C:\\ORIGIN\\' + u.tag + '\\' + ev.tag + '>');

    (function wave() {
