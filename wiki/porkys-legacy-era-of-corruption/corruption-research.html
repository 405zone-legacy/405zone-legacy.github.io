<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="../../favicon.ico">
  <link rel="stylesheet" href="../../style.css">
  <title>405Zone-Legacy</title>
  <script>if(window.self!==window.top)document.documentElement.classList.add('in-spa');</script>
  <style>
    @media(min-width:901px){
      html.in-spa, html.in-spa body { height:100%; overflow:hidden; }
    }
    html.in-spa .page-frame {
      display:flex; flex-direction:column; justify-content:center;
      height:calc(100vh - 2.2rem) !important;
      min-height:0 !important;
      padding:.5rem 1rem;
      overflow:hidden !important; /* NO SCROLL */
    }
    html.in-spa main { flex:0; }

    .cr-scene {
      position:relative;
      width:min(90vw, 85vh);
      height:min(90vw, 85vh);
      max-width:900px; max-height:900px;
      margin:0 auto;
    }

    .cr-center {
      position:absolute; inset:0;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      text-align:center; pointer-events:none;
      padding:28%;
    }
    .cr-center h1 { font-size:clamp(.8rem,2.5vw,1.3rem); margin:0 0 .4rem; line-height:1.2; color: blueviolet;}
    .cr-center p  { font-size:clamp(.6rem,1.5vw,.78rem); opacity:.72; margin:0; line-height:1.4; }

    .cr-btn {
      position:absolute;
      display:flex; flex-direction:column; align-items:center;
      gap:.3rem; cursor:pointer; text-decoration:none; color:#fff;
      transform:translate(-50%,-50%);
      user-select:none;
    }

    /* SQUARE CANVAS FOR EVERY ICON */
    .cr-btn .cr-icon-box {
      width:clamp(100px,13vw,160px);
      height:clamp(100px,13vw,160px);
      display:flex; align-items:center; justify-content:center;
      position:relative;
    }
    .cr-btn .cr-icon-box img {
      width:100%; height:100%;
      object-fit:contain;
      pointer-events:none;
      -webkit-user-drag:none;
      /* OUTLINE AND GLOW */
      --cr-outline: drop-shadow(0 0 1.5px var(--cr-outline-color, rgba(201,166,255,.55)));
      --cr-glow:    drop-shadow(0 0 8px   var(--cr-glow-color,    rgba(201,166,255,.0)));
      filter: var(--cr-outline) var(--cr-glow) drop-shadow(0 3px 10px rgba(0,0,0,.8));
      transition: filter .2s, transform .15s;
    }
    .cr-btn:hover .cr-icon-box img {
      --cr-glow: drop-shadow(0 0 18px var(--cr-glow-color, rgba(201,166,255,.95)));
      transform: scale(1.10);
    }

    /* cr-0 · Global Impact */
    #cr-0 .cr-icon-box img {
      --cr-outline-color: rgba(130, 255, 130, .60);
      --cr-glow-color:    rgba(130, 255, 130, .90);
    }
    /* cr-1 · Corrupted Spore */
    #cr-1 .cr-icon-box img {
      --cr-outline-color: rgba(120, 100, 255, .65);
      --cr-glow-color:    rgba(120, 100, 255, .95);
    }
    /* cr-2 · Sinner Land */
    #cr-2 .cr-icon-box img {
      --cr-outline-color: rgba(90, 0, 125, .65);
      --cr-glow-color:    rgba(90, 0, 125, .95);

    }
    /* cr-3 · Error_3008 (The Samside) */
    #cr-3 .cr-icon-box img {
      --cr-outline-color: rgba(33,  3,  3, .65);
      --cr-glow-color:    rgba(33,  3,  3, .90);
    }
    /* cr-4 · broken_heaven */
    #cr-4 .cr-icon-box img {
      --cr-outline-color: rgba(100, 200, 255, .60);
      --cr-glow-color:    rgba(100, 200, 255, .90);
    }
    /* cr-5 · Hazed Plains */
    #cr-5 .cr-icon-box img {
      --cr-outline-color: rgba(200,  60,  60, .65);
      --cr-glow-color:    rgba(200,  60,  60, .90);
    }
    /* cr-6 · Ominous Valley */
    #cr-6 .cr-icon-box img {
      --cr-outline-color: rgba(180, 100, 255, .65);
      --cr-glow-color:    rgba(180, 100, 255, .95);
    }

    .cr-btn span {
      font-size:clamp(.55rem,1.1vw,.72rem);
      letter-spacing:1px; opacity:.85;
      text-shadow:0 1px 6px rgba(0,0,0,.9);
      white-space:nowrap;
    }

    @media (max-width: 900px) {
      html.in-spa .page-frame {
        height: auto !important;
        min-height: calc(100vh - 2.2rem) !important;
        overflow-y: auto !important;
        justify-content: flex-start !important;
        padding-top: 3.2rem !important;
      }
      html.in-spa main { flex: initial; }

      .cr-scene {
        display: grid;
        grid-template-columns: 1fr 1fr;
        justify-items: center;
        align-items: start;
        gap: 1.6rem 1rem;
        width: 100%; height: auto;
        max-width: none; max-height: none;
        margin: 0;
      }
      .cr-center {
        grid-column: 1 / -1;
        position: static;
        pointer-events: auto;
        padding: 0 2vw 1rem;
      }
      .cr-btn {
        position: static !important;
        transform: none !important;
      }
      .cr-btn .cr-icon-box {
        width: clamp(96px, 28vw, 136px);
        height: clamp(96px, 28vw, 136px);
      }
      .cr-btn span {
        white-space: normal;
        text-align: center;
        font-size: clamp(.62rem, 2.4vw, .78rem);
      }

      #cr-0 { order: 1; }
      #cr-6 { order: 2; }
      #cr-1 { order: 3; }
      #cr-5 { order: 4; }
      #cr-2 { order: 5; }
      #cr-4 { order: 6; }
      #cr-3 {
        order: 7;
        grid-column: 1 / -1;
        justify-self: center;
      }
    }
  </style>
</head>
